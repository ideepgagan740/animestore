name: AI Code Review

on:
  pull_request:
    branches:
      - even
      - develop
      - master
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    name: AI Code Review

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Code Review
        uses: github/copilot-code-review-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Comment Review Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewFile = 'ai-review-results.json';
            
            if (fs.existsSync(reviewFile)) {
              const review = JSON.parse(fs.readFileSync(reviewFile, 'utf8'));
              
              let comment = '## 🤖 AI Code Review Results\n\n';
              
              if (review.issues && review.issues.length > 0) {
                comment += '### ⚠️ Issues Found:\n';
                review.issues.forEach(issue => {
                  comment += `- **${issue.severity}**: ${issue.message} (Line ${issue.line})\n`;
                });
              } else {
                comment += '### ✅ No critical issues found!\n';
              }
              
              if (review.suggestions && review.suggestions.length > 0) {
                comment += '\n### 💡 Suggestions:\n';
                review.suggestions.forEach(suggestion => {
                  comment += `- ${suggestion}\n`;
                });
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  block-merge-on-issues:
    runs-on: ubuntu-latest
    name: Block Merge on Critical Issues
    needs: ai-review
    if: failure()

    steps:
      - name: Fail workflow if critical issues found
        run: |
          echo "❌ AI review found critical issues. Merge is blocked."
          exit 1
